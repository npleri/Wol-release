# Compila la app (con tests) y el agente de Windows en cada push. Al subir un
# tag vX.Y.Z, además firma el APK y publica en GitHub Releases el APK y el
# agente ya compilado (zip autocontenido: no requiere .NET en la PC).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Tests y APK debug
        run: bash gradlew testDebugUnitTest assembleDebug

      - name: Compilar el agente de Windows
        run: |
          version="0.0.0"
          [[ "$GITHUB_REF" == refs/tags/v* ]] && version="${GITHUB_REF_NAME#v}"
          dotnet publish agent-windows/Wol.Agent -c Release -r win-x64 --self-contained true \
            -p:EnableWindowsTargeting=true -p:EnableCompressionInSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:Version="$version" \
            -o agent-dist/bin
          cp agent-windows/install.ps1 agent-windows/smoke-test.ps1 agent-dist/

      - name: Firmar y publicar el release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "versionName = \"$version\"" app/build.gradle.kts \
            || { echo "::error::El tag $GITHUB_REF_NAME no coincide con versionName en app/build.gradle.kts"; exit 1; }
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Faltan los secretos del keystore"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          bash gradlew assembleRelease
          apk="wol-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          agent="wol-agent-$GITHUB_REF_NAME.zip"
          (cd agent-dist && zip -qr "../$agent" .)
          sha256sum "$agent" > "$agent.sha256"
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" "$agent" "$agent.sha256" \
            --title "WoL $GITHUB_REF_NAME" --generate-notes
